<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c6f71">
  <meta name="robots" content="noindex">
  <title>Roadora is offline</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142222;background:#f7f3ec}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#e9f7f6 0,#f7f3ec 48%)}
    main{width:min(440px,100%);background:#fffdf9;border:1px solid #e4d7c2;border-radius:24px;padding:28px;box-shadow:0 18px 45px rgba(53,38,18,.12);text-align:center}
    .mark{width:72px;height:72px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;background:#0c6f71;color:#f7efe1;font-size:38px;font-weight:900}
    h1{margin:0;font-size:25px;letter-spacing:-.03em}p{color:#6d6254;line-height:1.55;margin:12px 0 22px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:14px;background:#0c6f71;color:#fff;text-decoration:none;font-weight:800}
    small{display:block;margin-top:18px;color:#8d7f6c}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">R</div>
    <h1>Geen internetverbinding</h1>
    <p>Roadora kan opgeslagen onderdelen van de app openen, maar voor een nieuwe route, actuele plekken en kaartgegevens is internet nodig.</p>
    <a href="/">Opnieuw proberen</a>
    <small>Je lokaal opgeslagen roadtrips worden niet verwijderd.</small>
  </main>
</body>
</html>
